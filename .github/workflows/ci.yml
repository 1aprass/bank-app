name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bank-app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build calculator
        run: mvn -f calculator/pom.xml package

      - name: Build statement
        run: mvn -f statement/pom.xml package

      - name: Build deal
        run: mvn -f deal/pom.xml package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bank-app
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Build dossier
        run: mvn -f dossier/pom.xml package -DskipTests

      - name: Build gateway
        run: mvn -f gateway/pom.xml package

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            calculator/target/site/jacoco/jacoco.xml
            statement/target/site/jacoco/jacoco.xml
            deal/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for svc in calculator statement deal gateway; do
            mvn -f $svc/pom.xml sonar:sonar \
              -Dsonar.projectKey=${{ secrets.SONAR_ORGANIZATION }}_$svc \
              -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          done